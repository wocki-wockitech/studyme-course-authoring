questions:
  - id: cb06c8a5-4bc9-4a11-ba08-cde5fc5457b4
    slug: callout-syntax
    type: multiple_choice
    difficulty: 1
    text: "Как сделать callout свёрнутым по умолчанию?"
    options:
      - text: "> [!hint]+ текст"
        feedback: "Плюс означает развёрнутый но сворачиваемый."
      - text: "> [!hint]- текст"
        correct: true
        feedback: "Минус после типа = свёрнут по умолчанию."
      - text: "> [!hint:collapsed] текст"
      - text: "> [!hint hidden] текст"
    reference_answer: >
      Минус после типа (`-`) = свёрнут. Плюс (`+`) = развёрнут но сворачиваемый.

  - id: 490321fa-a726-4eda-b61f-3787bef88f00
    slug: quiz-callout-syntax
    type: multiple_choice
    difficulty: 1
    text: "Как встроить вопрос с slug 'my-q' в текст урока?"
    options:
      - text: "> [!question] my-q"
      - text: "> [!quiz] my-q"
        correct: true
        feedback: "Верно! Платформа заменяет это на интерактивный виджет."
      - text: "{{quiz: my-q}}"
      - text: "[quiz](my-q)"
    reference_answer: >
      Синтаксис встраивания вопроса: > [!quiz] slug.
      Платформа заменяет это на интерактивный виджет.

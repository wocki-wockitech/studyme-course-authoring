id: ff5a328e-5f8b-4cbd-abda-333fa2b0448c
difficulty: 2
tags: []

questions:
  - type: multiple_choice
    text:
      ru: "Что нужно сделать чтобы новый урок появился в курсе? (выберите всё необходимое)"
      en: "What do you need to do for a new lesson to appear in the course? (select all required)"
    options:
      - text: { ru: "Создать папку с lesson.md", en: "Create a folder with lesson.md" }
      - text: { ru: "Добавить slug в block.yaml → lessons", en: "Add slug to block.yaml → lessons" }
      - text: { ru: "Зарегистрировать в course.yaml", en: "Register in course.yaml" }
      - text: { ru: "Создать папку + добавить в block.yaml", en: "Create folder + add to block.yaml" }
        correct: true
        feedback: { ru: "Нужно и создать папку, и прописать slug в block.yaml → lessons.", en: "You need both: create the folder and add the slug to block.yaml → lessons." }
    reference_answer:
      ru: >
        Нужно и создать папку (с lesson.md внутри), и добавить её имя
        в block.yaml → lessons. Без второго шага платформа не увидит урок.
      en: >
        You need to create a folder (with lesson.md inside) and add its name
        to block.yaml → lessons. Without the second step, the platform won't see the lesson.

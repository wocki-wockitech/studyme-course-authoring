questions:
  - id: ff5a328e-5f8b-4cbd-abda-333fa2b0448c
    slug: add-lesson-steps
    type: multiple_choice
    difficulty: 2
    text: "Что нужно сделать чтобы новый урок появился в курсе? (выберите всё необходимое)"
    options:
      - text: "Создать папку с lesson.md"
      - text: "Добавить slug в block.yaml → lessons"
      - text: "Зарегистрировать в course.yaml"
      - text: "Создать папку + добавить в block.yaml"
        correct: true
        feedback: "Нужно и создать папку, и прописать slug в block.yaml → lessons."
    reference_answer: >
      Нужно и создать папку (с lesson.md внутри), и добавить её имя
      в block.yaml → lessons. Без второго шага платформа не увидит урок.

  - id: d5f3a09d-c618-498f-a562-e6b2a223ba1f
    slug: lesson-progression
    type: true_false
    difficulty: 1
    text: "Студент может проходить уроки в любом порядке внутри блока."
    correct: false
    reference_answer: >
      Нет. Прогрессия линейная — следующий урок открывается только после
      завершения предыдущего. Порядок определяется списком lessons в block.yaml.

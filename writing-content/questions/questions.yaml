questions:
  - id: 721c14c8-dfd6-416e-bf57-d37203ea872b
    slug: question-index
    type: multiple_choice
    difficulty: 1
    text: "В новом формате, как отмечается правильный вариант?"
    options:
      - text: "Полем correct: <индекс> на уровне вопроса"
      - text: "Полем correct: true на самом варианте"
        correct: true
        feedback: "Верно! correct: true ставится на правильном варианте."
      - text: "Первый вариант в списке всегда правильный"
    reference_answer: >
      correct: true ставится на самом варианте ответа.
      Для нескольких правильных — на каждом из них.


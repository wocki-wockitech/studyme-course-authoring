questions:
  - type: code_fill
    text:
      ru: "Напишите что выведет каждый print:"
      en: "Write what each print will output:"
    file: list_ops.py
    slots:
      - answer: ["3"]
        explanation:
          ru: "len() возвращает количество элементов. a = [1, 2, 3] → len = 3"
          en: "len() returns element count. a = [1, 2, 3] → len = 3"
      - answer: ["1"]
        explanation:
          ru: "a[0] — первый элемент. append добавляет в конец, начало не меняется."
          en: "a[0] is the first element. append adds to the end."
      - answer: ["4"]
        explanation:
          ru: "a[-1] — последний элемент. После append(4) список [1,2,3,4], последний = 4."
          en: "a[-1] is the last element. After append(4), list is [1,2,3,4], last = 4."

  - type: ordering
    text:
      ru: "Расположите операции в порядке изменения len(a):"
      en: "Arrange operations in order of len(a) change:"
    items:
      - { ru: "len = 3 (начальное)", en: "len = 3 (initial)" }
      - { ru: "append(4) → len = 4", en: "append(4) → len = 4" }
      - { ru: "append(5) → len = 5", en: "append(5) → len = 5" }
      - { ru: "pop() → len = 4", en: "pop() → len = 4" }

id: f1a2b3c4-bbbb-4444-aaaa-000000000011
difficulty: 2
tags: [docker, multistage, build, deploy]

questions:
  - type: code_fill
    text:
      ru: "Дополните multi-stage Dockerfile для Go-приложения:"
      en: "Complete the multi-stage Dockerfile for a Go app:"
    file: Dockerfile
    slots:
      - answer: ["builder", "build"]
        hints:
          - { ru: "Имя стадии сборки (alias)", en: "Build stage name (alias)" }
      - answer: ["scratch", "alpine", "gcr.io/distroless/static"]
        hints:
          - { ru: "Минимальный образ для запуска (без OS)", en: "Minimal runtime image (no OS)" }
          - { ru: "scratch — пустой образ, только бинарник", en: "scratch — empty image, binary only" }
      - answer: ["builder", "build"]
        hints:
          - { ru: "Имя стадии откуда копируем бинарник", en: "Stage name to copy binary from" }

  - type: ordering
    text:
      ru: "Расположите шаги Docker multi-stage build в правильном порядке:"
      en: "Arrange Docker multi-stage build steps in correct order:"
    items:
      - { ru: "FROM golang AS builder", en: "FROM golang AS builder" }
      - { ru: "COPY и go mod download", en: "COPY and go mod download" }
      - { ru: "go build → бинарник", en: "go build → binary" }
      - { ru: "FROM scratch (финальный образ)", en: "FROM scratch (final image)" }
      - { ru: "COPY --from=builder бинарник", en: "COPY --from=builder binary" }

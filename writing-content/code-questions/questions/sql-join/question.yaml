id: f1a2b3c4-7777-4444-aaaa-000000000007
difficulty: 2
tags: [sql, join, order-by]

variants:
  - type: code_fill
    text:
      ru: "Дополните SQL-запрос для получения заказов пользователей:"
      en: "Complete the SQL query to get user orders:"
    file: query.sql
    slots:
      - answer: ["JOIN", "INNER JOIN", "LEFT JOIN"]
        hints:
          - { ru: "Ключевое слово для объединения таблиц", en: "Keyword to join tables" }
      - answer: ["u.id"]
        hints:
          - { ru: "По какому полю users связан с orders?", en: "Which users field links to orders?" }
      - answer: ["DESC"]
        hints:
          - { ru: "Сортировка от большего к меньшему", en: "Sort from highest to lowest" }

  - type: multiple_choice
    text:
      ru: "Какой JOIN вернёт только пользователей с заказами?"
      en: "Which JOIN returns only users with orders?"
    options:
      - text: "LEFT JOIN"
        feedback: { ru: "LEFT JOIN вернёт всех пользователей, даже без заказов.", en: "LEFT JOIN returns all users, even without orders." }
      - text: "INNER JOIN"
        correct: true
        feedback: { ru: "INNER JOIN — только строки с совпадением в обеих таблицах.", en: "INNER JOIN — only rows matching in both tables." }
      - text: "CROSS JOIN"
      - text: "FULL OUTER JOIN"

questions:
  - id: 76290b39-7036-40aa-8d67-f23c8deacde7
    slug: connect-steps
    type: multiple_choice
    difficulty: 1
    text: "Что нужно сделать ПЕРЕД подключением курса к платформе?"
    options:
      - "Создать PR в main"
      - "Создать Git-тег (например v1.0.0)"
      - "Отправить email администратору"
      - "Настроить CI/CD"
    correct: 1
    reference_answer: >
      Платформа индексирует только теги. Без тега нечего индексировать —
      connect вернёт ошибку "no tags found".

  - id: 841ad695-f532-4f6b-8d29-dc8e75cef007
    slug: update-flow
    type: multiple_choice
    difficulty: 2
    text: "Как обновить уже опубликованный курс для студентов?"
    options:
      - "Нажать 'Обновить' в панели администратора"
      - "Создать новый тег и пушнуть (или нажать Sync)"
      - "Удалить курс и подключить заново"
      - "Отправить запрос в поддержку"
    correct: 1
    reference_answer: >
      Создаёте новый тег (например v1.1.0), пушите с --tags.
      Платформа подхватит через webhook или кнопку Sync.
      Прогресс студентов сохраняется благодаря UUID.

questions:
  - id: 76290b39-7036-40aa-8d67-f23c8deacde7
    slug: connect-steps
    type: multiple_choice
    difficulty: 1
    text: "Что нужно сделать ПЕРЕД подключением курса к платформе?"
    options:
      - text: "Создать PR в main"
      - text: "Создать Git-тег (например v1.0.0)"
        correct: true
        feedback: "Платформа индексирует только теги. Без тега нечего индексировать."
      - text: "Отправить email администратору"
      - text: "Настроить CI/CD"
    reference_answer: >
      Платформа индексирует только теги. Без тега нечего индексировать —
      connect вернёт ошибку "no tags found".

  - id: a52c02d1-6dee-4012-9961-739a0b5145c4
    slug: update-flow
    type: multiple_choice
    difficulty: 2
    text: "Как обновить уже опубликованный курс для студентов?"
    options:
      - text: "Нажать 'Обновить' в панели администратора"
      - text: "Создать новый тег и пушнуть (или нажать Sync)"
        correct: true
        feedback: "Прогресс студентов сохраняется благодаря UUID."
      - text: "Удалить курс и подключить заново"
      - text: "Отправить запрос в поддержку"
    reference_answer: >
      Создаёте новый тег (например v1.1.0), пушите с --tags.
      Платформа подхватит через webhook или кнопку Sync.
      Прогресс студентов сохраняется благодаря UUID.

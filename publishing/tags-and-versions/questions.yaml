questions:
  - id: f98c1006-7e05-4f15-b3ff-493215ea2080
    slug: uuid-change
    type: true_false
    difficulty: 2
    text: "Можно безопасно изменить UUID урока если переименовали папку."
    correct: false
    reference_answer: >
      Нет! UUID никогда не меняется. Переименование папки меняет slug (URL),
      но UUID должен остаться прежним. Иначе прогресс студентов потеряется.

  - id: c6a87670-1e84-4160-b642-64f3363f00af
    slug: platform-indexing
    type: multiple_choice
    difficulty: 1
    text: "Что именно индексирует платформа?"
    options:
      - "Каждый коммит в main"
      - "Только Git-теги"
      - "Только PR в main"
      - "Все ветки"
    correct: 1
    reference_answer: >
      Платформа индексирует только теги Git. Промежуточные коммиты
      в main студентам не видны.

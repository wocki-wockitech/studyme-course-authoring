# Calls the reusable workflow from the template repo.
# Logic lives in studyme-course-template — no need to sync this file.

name: StudyMe — Auto-fill IDs

on:
  pull_request:
    paths:
      - "course.yaml"
      - "**/block.yaml"
      - "**/lesson.md"
      - "**/questions.yaml"
      - "**/challenge.yaml"

jobs:
  fill-ids:
    uses: wocki-wockitech/studyme-course-template/.github/workflows/studyme-id.yml@main
    permissions:
      contents: write
      pull-requests: write

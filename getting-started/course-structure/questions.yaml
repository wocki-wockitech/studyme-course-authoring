questions:
  - id: a81aa087-4f14-4cbb-baac-44bdd0e9d9d4
    slug: structure-hierarchy
    type: multiple_choice
    difficulty: 1
    text: "Откуда берётся slug урока?"
    options:
      - text: "Из поля slug: в lesson.md"
      - text: "Из имени папки"
        correct: true
      - text: "Генерируется автоматически"
      - text: "Из course.yaml"
    reference_answer: >
      Slug урока = имя его папки. В YAML slug не дублируется.

  - id:
    slug: block-yaml-purpose
    type: multiple_choice
    difficulty: 1
    text: "Что определяет block.yaml?"
    options:
      - text: "Список всех курсов на платформе"
      - text: "Название блока, порядок уроков и настройки теста"
        correct: true
      - text: "Только название блока"
      - text: "Стили оформления блока"
    reference_answer: >
      block.yaml содержит title, список lessons (порядок) и настройки
      итогового теста (question_count, pass_threshold).

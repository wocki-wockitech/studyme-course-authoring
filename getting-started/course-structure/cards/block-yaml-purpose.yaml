# Converted from flat questions.yaml → questions/ directory format with i18n
id: 886ba666-b239-4444-a99f-92778ed55ded
difficulty: 1
tags: [structure, block]

questions:
  - type: multiple_choice
    text:
      ru: "Что определяет block.yaml?"
      en: "What does block.yaml define?"
    options:
      - text: { ru: "Список всех курсов на платформе", en: "List of all courses on the platform" }
      - text: { ru: "Название блока, порядок уроков и настройки теста", en: "Block title, lesson order, and test settings" }
        correct: true
        feedback: { ru: "Верно! block.yaml содержит title, lessons и test.", en: "Correct! block.yaml contains title, lessons and test." }
      - text: { ru: "Только название блока", en: "Only the block title" }
      - text: { ru: "Стили оформления блока", en: "Block display styles" }

  - type: ordering
    text:
      ru: "Расположите уровни иерархии от верхнего к нижнему:"
      en: "Arrange hierarchy levels from top to bottom:"
    items:
      - { ru: "Курс (course.yaml)", en: "Course (course.yaml)" }
      - { ru: "Блок (block.yaml)", en: "Block (block.yaml)" }
      - { ru: "Урок (lesson.md)", en: "Lesson (lesson.md)" }
      - { ru: "Вопрос (questions.yaml)", en: "Question (questions.yaml)" }

  - type: true_false
    text:
      ru: "block.yaml определяет порядок уроков в блоке."
      en: "block.yaml defines the order of lessons in a block."
    correct: true

# Converted from flat questions.yaml → questions/ directory format with i18n
id: a81aa087-4f14-4cbb-baac-44bdd0e9d9d4
difficulty: 1
tags: [structure, basics]

questions:
  - type: multiple_choice
    text:
      ru: "Откуда берётся slug урока?"
      en: "Where does the lesson slug come from?"
    options:
      - text: { ru: "Из поля slug: в lesson.md", en: "From the slug: field in lesson.md" }
      - text: { ru: "Из имени папки", en: "From the folder name" }
        correct: true
      - text: { ru: "Генерируется автоматически", en: "Generated automatically" }
      - text: { ru: "Из course.yaml", en: "From course.yaml" }

  - type: true_false
    text:
      ru: "Slug урока определяется именем его папки."
      en: "The lesson slug is determined by its folder name."
    correct: true

  - type: matching
    text:
      ru: "Сопоставьте элемент курса и откуда берётся его slug:"
      en: "Match the course element to where its slug comes from:"
    pairs:
      - left: { ru: "Урок", en: "Lesson" }
        right: { ru: "Имя папки", en: "Folder name" }
      - left: { ru: "Вопрос", en: "Question" }
        right: { ru: "Поле slug: в YAML", en: "slug: field in YAML" }
      - left: { ru: "Блок", en: "Block" }
        right: { ru: "Имя папки", en: "Folder name" }
    distractors:
      - { ru: "Генерируется из title", en: "Generated from title" }

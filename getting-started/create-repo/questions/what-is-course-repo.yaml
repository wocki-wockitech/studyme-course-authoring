variants:
  - type: multiple_choice
    text:
      ru: "Что является source of truth для курса на StudyMe?"
      en: "What is the source of truth for a course on StudyMe?"
    options:
      - text: { ru: "База данных платформы", en: "Platform database" }
        feedback: { ru: "Нет, БД — это индекс. Источник правды — Git.", en: "No, the DB is an index. The source of truth is Git." }
      - text: { ru: "Git-репозиторий", en: "Git repository" }
        correct: true
        feedback: { ru: "Верно! Платформа индексирует репо при публикации тега.", en: "Correct! The platform indexes the repo when a tag is published." }
      - text: { ru: "Файл на Google Drive", en: "A file on Google Drive" }
        feedback: { ru: "Нет, платформа работает только с Git.", en: "No, the platform only works with Git." }
      - text: { ru: "Панель администратора", en: "Admin panel" }
        feedback: { ru: "Панель только отображает данные из Git.", en: "The panel only displays data from Git." }
    reference_answer:
      ru: >
        Git-репозиторий — единственный источник правды.
        Платформа индексирует его при публикации тега.
      en: >
        The Git repository is the single source of truth.
        The platform indexes it when a tag is published.

questions:
  - id: aee834aa-538a-47ba-8287-b188971e994a
    slug: what-is-course-repo
    type: multiple_choice
    difficulty: 1
    text: "Что является source of truth для курса на StudyMe?"
    options:
      - text: "База данных платформы"
        feedback: "Нет, БД — это индекс. Источник правды — Git."
      - text: "Git-репозиторий"
        correct: true
        feedback: "Верно! Платформа индексирует репо при публикации тега."
      - text: "Файл на Google Drive"
        feedback: "Нет, платформа работает только с Git."
      - text: "Панель администратора"
        feedback: "Панель только отображает данные из Git."
    reference_answer: >
      Git-репозиторий — единственный источник правды.
      Платформа индексирует его при публикации тега.
